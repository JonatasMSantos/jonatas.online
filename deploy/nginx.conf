server {
  listen ${PORT};
  listen [::]:${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  types {
    text/html                             html;
    text/css                              css;
    application/javascript                js mjs;
    application/json                      json;
    image/webp                            webp;
    image/png                             png;
    image/jpeg                            jpg jpeg;
    image/svg+xml                         svg;
    model/gltf-binary                     glb;
    font/woff2                            woff2;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
  gzip_min_length 1024;

  add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  add_header Pragma "no-cache" always;
  expires -1;

  # Assets pesados (modelos, imagens, fontes): cache de 7 dias. O add_header
  # local bloqueia a herança do no-store global; expires off evita header
  # duplicado de Cache-Control vindo do expires -1.
  location ~* \.(glb|webp|png|jpe?g|svg|woff2)$ {
    expires off;
    add_header Cache-Control "public, max-age=604800" always;
  }

  # Bundles do Vite têm hash no nome: cache longo e imutável.
  location ^~ /assets/ {
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
